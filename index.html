<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botão de Download PagBank</title>
    <style>
        .download-container {
            text-align: center;
            margin: 30px auto;
            font-family: Arial, sans-serif;
        }

        .btn-download {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: #00B159; /* Cor verde característica do PagSeguro/PagBank */
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 177, 89, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-download:hover {
            background-color: #008f47;
            transform: translateY(-2px);
        }

        .btn-download:active {
            transform: translateY(1px);
        }

        .subtext {
            display: block;
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="download-container">
        <!-- Substitua o '#' pelo link real da Google Play Store ou Apple App Store -->
        <a href="https://www.pagseguro.com.br/download" target="_blank" class="btn-download">
            📥 Baixar App PagBank
        </a>
        <span class="subtext">Disponível para Android e iOS</span>
    </div>

</body>
</html>
