<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resgate seu Cashback PagBank</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Marca d'água bem grande centralizada no fundo da página */
        body::before {
            content: "PagBank";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            font-size: 14vw;
            font-weight: 900;
            color: rgba(0, 177, 89, 0.04);
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
            letter-spacing: -2px;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.96);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 550px;
            width: 100%;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        h1 {
            color: #222;
            font-size: 26px;
            margin-bottom: 25px;
            border-bottom: 3px solid #00B159;
            padding-bottom: 12px;
            font-weight: 700;
        }

        .passo {
            margin-bottom: 20px;
            line-height: 1.6;
            color: #444;
            font-size: 15px;
            display: flex;
            align-items: flex-start;
        }

        .passo strong {
            color: #00B159;
            white-space: nowrap;
            margin-right: 6px;
        }

        .download-container {
            text-align: center;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }

        .btn-download {
            display: inline-block;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: #00B159;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(0, 177, 89, 0.35);
            transition: all 0.3s ease;
            animation: pulsarBotao 2.5s infinite ease-in-out;
        }

        .btn-download:hover {
            background-color: #008f47;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 177, 89, 0.45);
        }

        @keyframes pulsarBotao {
            0% {
                box-shadow: 0 6px 20px rgba(0, 177, 89, 0.35);
            }
            50% {
                box-shadow: 0 6px 25px rgba(0, 177, 89, 0.6), 0 0 0 10px rgba(0, 177, 89, 0.15);
            }
            100% {
                box-shadow: 0 6px 20px rgba(0, 177, 89, 0.35);
            }
        }

        .subtext {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            color: #c7254e;
            background-color: #f9f2f4;
            padding: 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .security-info {
            display: block;
            margin-top: 15px;
            font-size: 12px;
